publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_secure_storage: ^10.3.4
  mobile_scanner: ^7.4.2
  pdf: ^3.11.3
