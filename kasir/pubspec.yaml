name: kuki_pos
description: Kuki Bakehouse tablet-first POS for Android and iPadOS
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_secure_storage: 10.3.4
  mobile_scanner: ^7.4.2
  sqflite: ^2.4.2
  path: ^1.9.1
  pdf: ^3.11.3
  printing: 5.14.3
  crypto: ^3.0.6
  connectivity_plus: ^7.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
